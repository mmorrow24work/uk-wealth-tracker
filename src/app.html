<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>uk-wealth-tracker</title>
		<script>
			// Dark mode (issue #116), applied before Svelte hydrates so the first paint is never the
			// wrong theme. Mirrors `src/lib/theme.js`'s `resolveTheme()` (stored choice, else the OS
			// preference) — duplicated here because this file is static markup and can't import that
			// module. Keep the two in sync if this logic changes.
			(function () {
				try {
					var stored = localStorage.getItem('uk-wealth-tracker:theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();

			// Font family and text size preferences (issue #117), applied before Svelte hydrates for
			// the same reason as dark mode above. Mirrors `src/lib/typography.js`'s
			// `resolveFontFamily()`/`resolveTextSize()` (stored choice, else the app default -- there
			// is no OS preference to fall back to here, unlike theme) — duplicated here because this
			// file is static markup and can't import that module. Keep the two in sync if this logic
			// changes.
			(function () {
				try {
					var family = localStorage.getItem('uk-wealth-tracker:font-family');
					if (family === 'serif') document.documentElement.classList.add('font-serif');
					else if (family === 'rounded') document.documentElement.classList.add('font-rounded');

					var size = localStorage.getItem('uk-wealth-tracker:text-size');
					if (size === 'small') document.documentElement.classList.add('text-scale-small');
					else if (size === 'large') document.documentElement.classList.add('text-scale-large');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
