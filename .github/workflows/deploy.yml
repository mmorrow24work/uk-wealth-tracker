name: Deploy to GitHub Pages

# Builds the static SvelteKit output (adapter-static, see svelte.config.js)
# and publishes it to GitHub Pages. Issue #7 set up the adapter and base
# path but couldn't add this file itself -- the claude-code-action's
# GitHub App token doesn't have `workflows` write permission, a documented
# GitHub API restriction (see docs/github.md). Added by hand instead.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
