name: Autonomous Build Pipeline

# Cadence: schedule is a 15-minute backstop, not the real interval -- the
# pull_request(closed) trigger chains immediately into the next ready issue
# as soon as one merges. concurrency below ensures only one run is ever
# active, so overlapping triggers queue instead of racing.
on:
  schedule:
    - cron: "*/15 * * * *"
  pull_request:
    types: [closed]
  workflow_dispatch: {}

concurrency:
  group: claude-build
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # Merges performed with the default GITHUB_TOKEN don't trigger further
      # workflow runs (GitHub's anti-recursion protection) -- confirmed
      # empirically: a human-merged PR chained correctly, but the pipeline's
      # own GITHUB_TOKEN-merged PR did not, silently falling back to the
      # 15-min cron between every issue. A PAT belonging to a real account
      # isn't subject to that exemption, so gh pr merge --auto (and every
      # other gh call in this job) uses it instead.
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Force-close the issue this PR closes
        # GitHub's automatic "Closes #N" issue-closing has not fired
        # reliably on this fork (confirmed on two separate merges: #43->#2
        # and #44->#3, both left the issue open despite a correctly
        # recognized closingIssuesReferences link). Close it explicitly
        # instead of depending on that behavior.
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          issue_number=$(echo "${{ github.event.pull_request.body }}" | grep -ioP '[Cc]loses #\K\d+' | head -1)
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --reason completed || echo "Issue #$issue_number already closed or close failed -- continuing."
          else
            echo "No 'Closes #N' reference found in PR body -- nothing to close."
          fi

      - name: Pick next ready issue
        id: pick
        run: |
          # Sort by milestone number first, then issue number within it, so
          # issues added later (e.g. splitting an oversized issue) still slot
          # into the correct execution order by milestone rather than always
          # sorting to the back by raw issue number.
          issue_json=$(gh issue list --state open --label status:ready --json number,title,labels,milestone --limit 100 \
            | jq -c 'sort_by([(.milestone.number // 999), .number]) | .[0] // empty')

          if [ -z "$issue_json" ]; then
            echo "No status:ready issue found -- nothing to do this run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(echo "$issue_json" | jq -r '.number')
          title=$(echo "$issue_json" | jq -r '.title')
          model_label=$(echo "$issue_json" | jq -r '[.labels[].name] | map(select(startswith("model:"))) | .[0] // "model:sonnet"')
          case "${model_label#model:}" in
            haiku) model_id="claude-haiku-4-5" ;;
            opus) model_id="claude-opus-5" ;;
            *) model_id="claude-sonnet-5" ;;
          esac

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "model=$model_id" >> "$GITHUB_OUTPUT"

      - name: Mark issue in-progress
        if: steps.pick.outputs.found == 'true'
        run: |
          gh issue edit "${{ steps.pick.outputs.number }}" \
            --remove-label "status:ready" --add-label "status:in-progress"

      - name: Run Claude Code
        if: steps.pick.outputs.found == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Default allowedTools for non-comment-triggered runs is read-only
          # (Glob, Grep, LS, Read) -- Bash/Write/Edit must be granted
          # explicitly or every scaffold/feature issue fails with tool
          # permission denials before writing anything.
          claude_args: "--model ${{ steps.pick.outputs.model }} --max-turns 100 --allowedTools Bash,Write,Edit,Read,Glob,Grep,LS"
          base_branch: main
          branch_prefix: "issue-"
          display_report: true
          # TEMPORARY debug aid: two issues in a row hit error_max_turns at
          # ~60-61 turns, including one that shouldn't have been oversized
          # (nav shell + routing). Bumping the cap and showing full output
          # once to see what's actually consuming turns, since guessing
          # again isn't worth the ~$2-3/attempt cost. Revert after diagnosis.
          show_full_output: true
          prompt: |
            Implement GitHub issue #${{ steps.pick.outputs.number }} ("${{ steps.pick.outputs.title }}")
            in this repository, fully and to a working, tested state. Read CLAUDE.md, README.md and
            DESIGN.md first for architecture and conventions.

            When the implementation is complete:
            1. Open a pull request whose description includes the line "Closes #${{ steps.pick.outputs.number }}".
            2. Append one entry to docs/journal.md, following the format documented at the top of that
               file. Use today's date. Write the "Decisions" and "Trade-offs / deviations from prompt"
               sections yourself, in the same voice and level of detail as any existing entries. For the
               <!-- METRICS:... --> block, copy the six placeholder tokens (__DURATION__, __MODEL__,
               __TURNS__, __INPUT_TOKENS__, __OUTPUT_TOKENS__, __COST__) verbatim into the new entry --
               do not fill them in yourself; a later automated step replaces them with the real numbers
               for this run.

      - name: Find PR created for this issue
        # The action's branch_name/session_id outputs are only populated in
        # its own "tag mode" (auto-branch-creation for @claude comment
        # triggers). In our schedule/dispatch-triggered "agent mode", Claude
        # creates the branch itself via Bash/git as instructed in the
        # prompt, so the action has no visibility into it even though the
        # PR genuinely exists. Detect it directly via the "Closes #N" text
        # we told Claude to include.
        if: steps.pick.outputs.found == 'true'
        id: findpr
        run: |
          pr_json=$(gh pr list --state open --json number,headRefName,body --limit 100 \
            | jq -c --arg n "${{ steps.pick.outputs.number }}" \
              '[.[] | select(.body | test("[Cc]loses #" + $n + "(\\D|$)"))] | .[0] // empty')

          if [ -z "$pr_json" ]; then
            echo "No PR found referencing Closes #${{ steps.pick.outputs.number }} -- Claude did not finish (e.g. hit max-turns)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pr_json" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$pr_json" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"

      - name: Patch journal metrics
        if: steps.pick.outputs.found == 'true' && steps.findpr.outputs.found == 'true'
        continue-on-error: true
        run: |
          git fetch origin "${{ steps.findpr.outputs.branch }}"
          git checkout "${{ steps.findpr.outputs.branch }}"

          end=$(date +%s)
          duration=$(( end - ${{ steps.timer.outputs.start }} ))
          model="${{ steps.pick.outputs.model }}"

          execution_file="${{ steps.claude.outputs.execution_file }}"
          turns=0
          input_tokens=0
          output_tokens=0
          # Best-effort parse of the Claude Code execution transcript. Schema
          # isn't officially pinned down; fall back to 0 rather than failing
          # the step if the shape doesn't match.
          if [ -n "$execution_file" ] && [ -f "$execution_file" ]; then
            turns=$(jq '[.[] | select(.type=="assistant")] | length' "$execution_file" 2>/dev/null || echo 0)
            input_tokens=$(jq '[.. | .input_tokens? // empty] | add // 0' "$execution_file" 2>/dev/null || echo 0)
            output_tokens=$(jq '[.. | .output_tokens? // empty] | add // 0' "$execution_file" 2>/dev/null || echo 0)
          fi

          case "$model" in
            claude-opus-5) in_rate=5; out_rate=25 ;;
            claude-haiku-4-5) in_rate=1; out_rate=5 ;;
            *) in_rate=3; out_rate=15 ;;
          esac
          cost=$(awk -v i="$input_tokens" -v o="$output_tokens" -v ir="$in_rate" -v orr="$out_rate" \
            'BEGIN { printf "%.4f", (i/1000000*ir) + (o/1000000*orr) }')

          sed -i \
            -e "s/__DURATION__/${duration}/" \
            -e "s/__MODEL__/${model}/" \
            -e "s/__TURNS__/${turns}/" \
            -e "s/__INPUT_TOKENS__/${input_tokens}/" \
            -e "s/__OUTPUT_TOKENS__/${output_tokens}/" \
            -e "s/__COST__/${cost}/" \
            docs/journal.md

          git config user.name "claude-build-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add docs/journal.md
          git commit -m "Fill in journal metrics for issue #${{ steps.pick.outputs.number }}" || echo "Nothing to commit"
          git push origin "HEAD:${{ steps.findpr.outputs.branch }}"

      - name: Mark issue in-review
        if: steps.pick.outputs.found == 'true' && steps.findpr.outputs.found == 'true'
        run: |
          gh issue edit "${{ steps.pick.outputs.number }}" \
            --remove-label "status:in-progress" --add-label "status:in-review"

      - name: Enable auto-merge
        if: steps.pick.outputs.found == 'true' && steps.findpr.outputs.found == 'true'
        run: |
          gh pr merge "${{ steps.findpr.outputs.number }}" --auto --squash
